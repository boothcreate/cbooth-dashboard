# ---------------------------------------------------------------------------
# Google Calendar reminders.
#
# A dated to-do (has a `due`) gets a Google Calendar event with a popup
# reminder at `send_time` on its due date — created the moment you save the
# to-do, not on a timer, so it works even while this PC (or serve.py) is
# off; Google's own servers deliver the notification. A to-do can override
# send_time for itself via its own remind_time field. Undated to-dos never
# get an event — there's no date to put it on. Marking a to-do done, or
# clearing its due date, deletes its event.
#
# Needs a one-time Google Cloud Console OAuth setup — see BUILD.md, "Google
# Calendar reminders" for the exact click-by-click steps, and
# scripts/google_calendar_auth.py for the script that finishes it. With
# GOOGLE_CALENDAR_CLIENT_ID / _CLIENT_SECRET / _REFRESH_TOKEN unset in .env,
# the to-do still saves normally, it just won't reach your phone, and the
# dashboard says so rather than pretending it worked.
# ---------------------------------------------------------------------------
reminders:
  enabled: true
  calendar_id: "primary"        # which Google Calendar to write events to
  send_time: "08:00"            # default 24h HH:MM. A to-do can override this
                                 # for itself via its own remind_time field.

# Countdown panel. Anything here shows days remaining on the dashboard.
