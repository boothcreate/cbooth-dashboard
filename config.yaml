# config.yaml — single source of truth.
# Change something here, re-run the scripts, the dashboard follows.

owner:
  name: "Charles Booth"                      # your name, shown in the header
  school: University of Vermont
  term: Fall 2026
  term_start: "2026-08-31"   # first day of classes -- synthesized recurring class
                              # schedule blocks (see BUILD.md, "Class contact info &
                              # synthesized schedule blocks") never show before this
                              # date, even on a matching weekday. Keep in sync with
                              # the "First day of classes" milestone below.

# ---------------------------------------------------------------------------
# Your classes.
#
# 'tag'   is the short code used everywhere: calendar chips, document
#         filenames, deadline grouping. One vocabulary across the whole system.
# 'match' is what to look for in the calendar event to recognise the class.
#         Brightspace course names are often long ("NSCI 1100 A - Fall 2026"),
#         so put a distinctive fragment here.
# 'address' is OPTIONAL and blank by default on purpose — the dashboard never
#         guesses one. Fill in a real, mapable address (building name is
#         usually enough, e.g. "Innovation Hall, University of Vermont,
#         Burlington VT") and every event/to-do tagged with this class gets a
#         one-tap Apple Maps directions link, on the schedule block and on
#         any reminder email, automatically — set it once here, not per to-do.
# 'grades_url' is OPTIONAL and blank by default — the grades panel never
#         guesses one either. It's that course's Brightspace "My Grades" page
#         URL (open the course in Brightspace, click Grades, copy the address
#         bar). Set it once here and `scripts/fetch_grades.py` picks it up —
#         see BUILD.md, "Grades panel," which is scaffolding as of 2026-08-20:
#         the scraper reaches the page but doesn't parse it yet.
# 'brightspace_url' is OPTIONAL and blank by default (added 2026-08-23) —
#         that course's Brightspace content/home page. Brightspace's calendar
#         feed doesn't carry a URL for individual assignments (checked against
#         your real feed — no VEVENT has a URL field), so this is a link to
#         the course itself, not the specific assignment; shows as "Open in
#         Brightspace" on that class's deadline items and schedule block.
# 'instructor' is OPTIONAL (name/email/office/office_hours, all blank by
#         default) — added 2026-08-21. Shows up when you click that class's
#         schedule block on the dashboard. See BUILD.md, "Class contact info
#         & synthesized schedule blocks."
# 'same_class_as' is OPTIONAL (added 2026-08-23) — set it to another class's
#         tag when THIS entry isn't really a separate course, just a second
#         weekly meeting time for one you've already listed (this app has no
#         way to give one class two meets/time/room blocks, so a second entry
#         is how that's modeled). Confirmed 2026-08-23: CHEM-1400-EVE is the
#         same Brightspace enrollment/grade as CHEM-1400, just its Monday
#         evening session — CHEM-1400-L51 (the lab) is a genuinely separate
#         Brightspace course, so it does NOT get this field. A class with
#         same_class_as set: never gets scraped for its own grade (inherits
#         the aliased class's instead), never shows its own row in the Grades
#         panel, and inherits brightspace_url automatically if it doesn't set
#         its own — see BUILD.md, "Same-class aliasing."
#
# IMPORTANT: run `python scripts/fetch_brightspace.py --inspect` FIRST and look
# at real events from your feed before filling this in. Canvas puts the course
# in CATEGORIES; Brightspace often folds it into SUMMARY instead. You need to
# see which one yours does.
# ---------------------------------------------------------------------------
